<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Pure Black App Icon Background (#000000) with Crisp White Border (#FFFFFF) — 100% Black & White Only -->
  <rect
    x="8"
    y="8"
    width="240"
    height="240"
    rx="54"
    ry="54"
    fill="#000000"
    stroke="#ffffff"
    stroke-width="10"
  />

  <!-- Subtle Inner White Frame Line -->
  <rect
    x="20"
    y="20"
    width="216"
    height="216"
    rx="44"
    ry="44"
    fill="none"
    stroke="#ffffff"
    stroke-width="2"
    stroke-opacity="0.35"
  />

  <!-- White Broadcast Antennas & Base Pedestal -->
  <g stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Left Antenna -->
    <line x1="112" y1="74" x2="78" y2="36" stroke-width="8" />
    <circle cx="76" cy="34" r="6" fill="#ffffff" stroke="none" />
    <!-- Right Antenna -->
    <line x1="128" y1="74" x2="164" y2="36" stroke-width="8" />
    <circle cx="166" cy="34" r="6" fill="#ffffff" stroke="none" />
    <!-- Antenna Base Mount -->
    <path d="M 98 76 Q 120 62 142 76" stroke-width="7" fill="#000000" />
  </g>

  <!-- Pure Black & White Television Cabinet Body -->
  <g>
    <!-- TV Outer White Body -->
    <rect
      x="34"
      y="74"
      width="164"
      height="120"
      rx="24"
      ry="24"
      fill="#000000"
      stroke="#ffffff"
      stroke-width="9"
    />

    <!-- TV Inner Screen (Pure Black with White Bezel) -->
    <rect
      x="48"
      y="88"
      width="116"
      height="92"
      rx="14"
      ry="14"
      fill="#000000"
      stroke="#ffffff"
      stroke-width="5"
    />

    <!-- Right-Side TV Control Panel (White Dial & Speaker Grille Bars) -->
    <circle cx="181" cy="108" r="7" fill="#ffffff" />
    <circle cx="181" cy="128" r="5" fill="#000000" stroke="#ffffff" stroke-width="3" />
    <line x1="175" y1="148" x2="187" y2="148" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
    <line x1="175" y1="158" x2="187" y2="158" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
    <line x1="175" y1="168" x2="187" y2="168" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />

    <!-- TV Stand Legs in White -->
    <line x1="74" y1="196" x2="62" y2="214" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
    <line x1="158" y1="196" x2="170" y2="214" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
  </g>

  <!-- Bold Pure White "TV" Emblem Inside Screen -->
  <g fill="#ffffff">
    <!-- Letter T -->
    <path d="M 62 110 H 100 V 122 H 87 V 160 H 75 V 122 H 62 Z" />
    <!-- Letter V -->
    <path d="M 104 110 H 117 L 126 144 L 135 110 H 148 L 132 160 H 120 Z" />
  </g>

  <!-- Overlapping Black & White Play Broadcast Badge (Bottom-Right) -->
  <g>
    <circle
      cx="188"
      cy="178"
      r="36"
      fill="#000000"
      stroke="#ffffff"
      stroke-width="8"
    />
    <!-- Pure White Play Triangle -->
    <path
      d="M 177 160 L 209 178 L 177 196 Z"
      fill="#ffffff"
      stroke="#ffffff"
      stroke-width="3"
      stroke-linejoin="round"
    />
  </g>
</svg>
