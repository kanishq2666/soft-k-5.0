    <script>
      (function () {
        function isWasmClosureErr(errOrMsg) {
          var msg =
            typeof errOrMsg === 'string'
              ? errOrMsg
              : errOrMsg && (errOrMsg.message || String(errOrMsg))
                ? String(errOrMsg.message || errOrMsg)
                : '';
          return (
            msg.indexOf('closure invoked recursively') !== -1 ||
            msg.indexOf('after being dropped') !== -1 ||
            msg.indexOf('recursive use of an object') !== -1 ||
            msg.indexOf('Ruffle') !== -1
          );
        }

        window.addEventListener(
          'error',
          function (e) {
            if (isWasmClosureErr(e.message) || isWasmClosureErr(e.error)) {
              e.preventDefault();
              e.stopImmediatePropagation();
              return false;
            }
          },
          true
        );

        window.addEventListener(
          'unhandledrejection',
          function (e) {
            if (isWasmClosureErr(e.reason)) {
              e.preventDefault();
              e.stopImmediatePropagation();
              return false;
            }
          },
          true
        );

        if (typeof window.requestAnimationFrame === 'function') {
          var origRAF = window.requestAnimationFrame.bind(window);
          window.requestAnimationFrame = function (cb) {
            return origRAF(function (ts) {
              try {
                return cb(ts);
              } catch (err) {
                if (!isWasmClosureErr(err)) throw err;
              }
            });
          };
        }

        if (typeof window.setTimeout === 'function') {
          var origSetTimeout = window.setTimeout.bind(window);
          window.setTimeout = function (fn, delay) {
            if (typeof fn !== 'function') {
              return origSetTimeout.apply(window, arguments);
            }
            var args = Array.prototype.slice.call(arguments, 2);
            return origSetTimeout(function () {
              try {
                return fn.apply(this, args);
              } catch (err) {
                if (!isWasmClosureErr(err)) throw err;
              }
            }, delay);
          };
        }

        if (typeof window.ResizeObserver === 'function') {
          var OrigRO = window.ResizeObserver;
          window.ResizeObserver = function (cb) {
            return new OrigRO(function (entries, observer) {
              try {
                return cb(entries, observer);
              } catch (err) {
                if (!isWasmClosureErr(err)) throw err;
              }
            });
          };
          window.ResizeObserver.prototype = OrigRO.prototype;
        }
      })();
    </script>
